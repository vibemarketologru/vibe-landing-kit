name: Проверка каталога
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Контраст, шрифты с кириллицей, анимации, ссылки
        run: node tools/check.mjs .
      - name: README собран из catalog.json
        run: |
          python3 tools/build-readme.py
          git diff --exit-code README.md README.en.md
